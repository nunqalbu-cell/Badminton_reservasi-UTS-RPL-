name: Python CI Pipeline - Reservasi Badminton

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Linter Check (Flake8)
      run: |
        flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Automated Unit Testing (Pytest)
      run: |
        python -m pytest -v